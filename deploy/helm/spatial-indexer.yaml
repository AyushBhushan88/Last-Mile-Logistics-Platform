apiVersion: apps/v1
kind: Deployment
metadata:
  name: spatial-indexer
spec:
  # Replicas managed by HPA
  selector:
    matchLabels:
      app: spatial-indexer
  template:
    metadata:
      labels:
        app: spatial-indexer
    spec:
      containers:
      - name: spatial-indexer
        image: logistics-platform/spatial-indexer:latest
        command: ["./spatial-indexer"]
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: REDIS_ADDR
          value: "redis:6379"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spatial-indexer-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spatial-indexer
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
