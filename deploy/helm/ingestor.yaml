apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingestor
  template:
    metadata:
      labels:
        app: ingestor
    spec:
      containers:
      - name: ingestor
        image: logistics-platform/ingestor:latest
        ports:
        - containerPort: 8080
        - containerPort: 50051
        env:
        - name: REDIS_ADDR
          value: "redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor
spec:
  selector:
    app: ingestor
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: grpc
    protocol: TCP
    port: 50051
    targetPort: 50051
  type: LoadBalancer
